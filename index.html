<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Stream Web Player</title>
  <!-- Shaka Player compiled library and UI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
  <style>
    :root {
      --bg: #18110f;
      --card: #231917;
      --border: #6e554f;
      --accent: #e64a19;
      --text: #f5ebe6;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 750px;
    }
    h2 { font-weight: 500; margin-bottom: 20px; }
    .video-wrapper {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    video { width: 100%; height: 100%; }
    .input-group {
      position: relative;
      margin-bottom: 16px;
    }
    .input-group label {
      position: absolute;
      top: -9px;
      left: 12px;
      background: var(--bg);
      padding: 0 6px;
      font-size: 12px;
      color: #bcaaa4;
    }
    input, select {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: #ff8a65; }
    select option { background: var(--card); color: var(--text); }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .proxy-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #bcaaa4;
      cursor: pointer;
    }
    .proxy-toggle input { width: auto; }
    .play-btn {
      background: var(--accent);
      color: white;
      border: none;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(230, 74, 25, 0.4);
      transition: transform 0.15s ease;
    }
    .play-btn:hover { transform: scale(1.05); }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #ffab91;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Network Stream (Video) Player</h2>

  <!-- Video Player Container -->
  <div class="video-wrapper" data-shaka-player-container>
    <video autoplay data-shaka-player id="video"></video>
  </div>

  <!-- Input Fields -->
  <div class="input-group">
    <label>Media Stream URL (Supports | pipe parameters)</label>
    <input type="text" id="streamUrl" placeholder="https://example.com/index.mpd?|drmScheme=clearkey&drmLicense=...">
  </div>

  <div class="input-group">
    <label>Cookie Value</label>
    <input type="text" id="cookieVal" placeholder="Optional cookie header">
  </div>

  <div class="input-group">
    <label>Referer Value</label>
    <input type="text" id="refererVal" placeholder="Optional referer URL">
  </div>

  <div class="input-group">
    <label>Origin Value</label>
    <input type="text" id="originVal" placeholder="Optional origin URL">
  </div>

  <div class="input-group">
    <label>DRM License (KeyID:Key or License Server URL)</label>
    <input type="text" id="drmLicense" placeholder="kid_hex:key_hex OR https://license-server.com">
  </div>

  <div class="row">
    <div class="input-group">
      <label>UserAgent</label>
      <input type="text" id="userAgent" value="Default">
    </div>
    <div class="input-group">
      <label>DrmScheme</label>
      <select id="drmScheme">
        <option value="clearkey">clearkey</option>
        <option value="widevine">widevine</option>
        <option value="none">none</option>
      </select>
    </div>
  </div>

  <div class="controls-bar">
    <label class="proxy-toggle">
      <input type="checkbox" id="useProxy">
      Route through Cloudflare Worker Proxy (Required if sending custom Cookie/Referer/User-Agent)
    </label>
    <button class="play-btn" id="playBtn" title="Play Stream">&#9654;</button>
  </div>

  <div id="status">Ready. Paste a stream URL and press Play.</div>
</div>

<script>
  let player;

  // Auto-parse pipe-delimited URLs when pasted or edited
  document.getElementById('streamUrl').addEventListener('input', function(e) {
    const raw = e.target.value.trim();
    if (!raw.includes('|')) return;

    const [baseUrl, paramString] = raw.split('|', 2);
    e.target.value = baseUrl.replace(/\?$/, '');

    const params = paramString.split('&');
    params.forEach(p => {
      const idx = p.indexOf('=');
      if (idx === -1) return;
      const key = p.substring(0, idx).trim().toLowerCase();
      const val = decodeURIComponent(p.substring(idx + 1).trim());

      if (key === 'cookie') {
        document.getElementById('cookieVal').value = val;
        document.getElementById('useProxy').checked = true;
      } else if (key === 'referer') {
        document.getElementById('refererVal').value = val;
        document.getElementById('useProxy').checked = true;
      } else if (key === 'origin') {
        document.getElementById('originVal').value = val;
        document.getElementById('useProxy').checked = true;
      } else if (key === 'user-agent') {
        document.getElementById('userAgent').value = val;
        document.getElementById('useProxy').checked = true;
      } else if (key === 'drmscheme') {
        document.getElementById('drmScheme').value = val.toLowerCase();
      } else if (key === 'drmlicense') {
        document.getElementById('drmLicense').value = val;
      }
    });
    setStatus('Parsed inline URL parameters automatically.');
  });

  function setStatus(msg) {
    document.getElementById('status').textContent = msg;
  }

  async function initPlayer() {
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) {
      setStatus('Browser is not supported by Shaka Player.');
      return;
    }
    const video = document.getElementById('video');
    const ui = video['ui'];
    const controls = ui.getControls();
    player = controls.getPlayer();

    player.addEventListener('error', (event) => {
      setStatus('Player Error: ' + event.detail.message + ' (Code ' + event.detail.code + ')');
    });
  }

  async function loadStream() {
    const manifestUrl = document.getElementById('streamUrl').value.trim();
    const cookie = document.getElementById('cookieVal').value.trim();
    const referer = document.getElementById('refererVal').value.trim();
    const origin = document.getElementById('originVal').value.trim();
    const userAgent = document.getElementById('userAgent').value.trim();
    const drmScheme = document.getElementById('drmScheme').value;
    const drmLicense = document.getElementById('drmLicense').value.trim();
    const useProxy = document.getElementById('useProxy').checked;

    if (!manifestUrl) {
      setStatus('Please enter a valid Media Stream URL.');
      return;
    }

    player.resetConfiguration();

    // 1. Configure DRM (ClearKey or Widevine)
    const drmConfig = {};
    if (drmScheme === 'clearkey' && drmLicense.includes(':')) {
      const clearKeys = {};
      // Supports multiple keys separated by comma if needed
      drmLicense.split(',').forEach(pair => {
        const [kid, key] = pair.split(':');
        if (kid && key) clearKeys[kid.trim()] = key.trim();
      });
      drmConfig.clearKeys = clearKeys;
    } else if (drmScheme === 'widevine' && drmLicense.startsWith('http')) {
      drmConfig.servers = { 'com.widevine.alpha': drmLicense };
    }
    player.configure({ drm: drmConfig });

    // 2. Configure Networking / Proxy Filter for Custom Headers
    player.getNetworkingEngine().clearAllRequestFilters();
    if (useProxy) {
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        const originalUri = request.uris[0];
        const proxyUrl = new URL('/proxy', window.location.origin);
        proxyUrl.searchParams.set('url', originalUri);
        if (cookie) proxyUrl.searchParams.set('cookie', cookie);
        if (referer) proxyUrl.searchParams.set('referer', referer);
        if (origin) proxyUrl.searchParams.set('origin', origin);
        if (userAgent && userAgent !== 'Default') {
          proxyUrl.searchParams.set('ua', userAgent);
        }
        request.uris[0] = proxyUrl.toString();
      });
    }

    // 3. Load the Stream
    try {
      setStatus('Loading stream...');
      await player.load(manifestUrl);
      setStatus('Playing stream.');
    } catch (e) {
      setStatus(`Failed to load stream (Code: ${e.code}). Check CORS or enable Proxy.`);
      console.error(e);
    }
  }

  document.addEventListener('shaka-ui-loaded', initPlayer);
  document.getElementById('playBtn').addEventListener('click', loadStream);
</script>

</body>
</html>
